name: aggie_ride
description: "Student-Powered Ride Sharing in College Station for Texas A&M Makeathon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Backend & Cloud Services (Supabase + Firebase Free Tier)
  supabase_flutter: ^2.8.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # Image selection for profile & vehicle photo uploads
  image_picker: ^1.1.2

  # Local Notifications & Free Device Alerts
  flutter_local_notifications: ^17.2.3

  # Local persistence & utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

